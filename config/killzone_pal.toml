# Classification policy (aligned with analyzer intent):
# - runtime-known names -> [general].stubs
# - library-like names without runtime handlers -> [general].untracked_stubs
# - [general].skip is retained empty for legacy compatibility
# - no SCE symbol database is used by this Ghidra script

[general]
input = "D:/KillzoneRecomp/work/pal/elf/SCES_528.93"
output = "D:/KillzoneRecomp/generated_pal"
ghidra_output = "D:/KillzoneRecomp/work/pal/functions_pal.csv"
