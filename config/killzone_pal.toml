# Frame timer runs on every vblank instead of every other one (docs/findings.md#frame-timing-key-for-high-refresh).
# With the port's virtual vblank rate R (= target fps) and seconds-per-vsync (PAL 0x55B4E4, US 0x55A6E4) = 1/R, the simulation steps by
# real elapsed time at R frames per second.
[patches]
instructions = [
  { address = "0x001C0208", value = "0x00000000" }, # FUN_001c01f0 (US FUN_001bfe88): add.s $f0,$f0,$f0 -> nop  (tick = 1 vsync period)
  { address = "0x001C021C", value = "0x00052802" }, # FUN_001c01f0 (US FUN_001bfe88): srl $a1,$a1,1 -> srl $a1,$a1,0
  { address = "0x001C0220", value = "0x00031802" }, # FUN_001c01f0 (US FUN_001bfe88): srl $v1,$v1,1 -> srl $v1,$v1,0
  { address = "0x001C02A4", value = "0x00021002" }, # FUN_001c0278 (US FUN_001bff10): srl $v0,$v0,1 -> srl $v0,$v0,0
  # PAL only (work/pal/PAL_VIDEO.md): run the game's NTSC 60 Hz / 448-line path and its _NTSC movies.
  { address = "0x001BD79C", value = "0x38420001" }, # xori $v0,$v0,2 -> xori $v0,$v0,1 (same site as the "NTSC Mode" pnach)
  { address = "0x001C236C", value = "0xAC400030" }, # sw $v1,0x30($v0) -> sw $zero,0x30($v0) (a menu cannot switch back to PAL)
]
